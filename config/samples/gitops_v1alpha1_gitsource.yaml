apiVersion: gitops.miniargo.dev/v1alpha1
kind: GitSource
metadata:
  labels:
    app.kubernetes.io/name: mini-argo
    app.kubernetes.io/managed-by: kustomize
  name: gitsource-sample
spec:
  # Phase 3 reads from local disk, so repo is recorded but not yet used.
  repo: https://github.com/csakilan/mini-argo
  branch: main
  path: ./testdata/manifests
  interval: 30s
  prune: false
