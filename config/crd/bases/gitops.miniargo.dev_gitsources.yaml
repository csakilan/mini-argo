---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: gitsources.gitops.miniargo.dev
spec:
  group: gitops.miniargo.dev
  names:
    kind: GitSource
    listKind: GitSourceList
    plural: gitsources
    singular: gitsource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lastSyncedCommit
      name: Commit
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GitSource is the Schema for the gitsources API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of GitSource
            properties:
              branch:
                default: main
                description: branch is the branch to read manifests from.
                type: string
              interval:
                default: 30s
                description: interval is how often to re-sync the cluster with the
                  repository.
                type: string
              path:
                default: .
                description: path is the subdirectory within the repository to read.
                  "." means the root.
                type: string
              prune:
                default: false
                description: prune enables deletion of objects that have been removed
                  from Git.
                type: boolean
              repo:
                description: repo is the public HTTPS URL of the Git repository to
                  sync from.
                type: string
            required:
            - repo
            type: object
          status:
            description: status defines the observed state of GitSource
            properties:
              driftedObjects:
                description: driftedObjects lists objects the last sync had to correct.
                items:
                  description: ResourceRef identifies a single Kubernetes object this
                    GitSource applied.
                  properties:
                    group:
                      description: group is the API group of the object. Empty for
                        core types such as Service.
                      type: string
                    kind:
                      description: kind is the kind of the object.
                      type: string
                    name:
                      description: name is the name of the object.
                      type: string
                    namespace:
                      description: namespace is the namespace of the object. Empty
                        for cluster-scoped objects.
                      type: string
                    version:
                      description: version is the API version of the object.
                      type: string
                  required:
                  - kind
                  - name
                  - version
                  type: object
                type: array
              inventory:
                description: inventory lists every object this GitSource currently
                  owns.
                items:
                  description: ResourceRef identifies a single Kubernetes object this
                    GitSource applied.
                  properties:
                    group:
                      description: group is the API group of the object. Empty for
                        core types such as Service.
                      type: string
                    kind:
                      description: kind is the kind of the object.
                      type: string
                    name:
                      description: name is the name of the object.
                      type: string
                    namespace:
                      description: namespace is the namespace of the object. Empty
                        for cluster-scoped objects.
                      type: string
                    version:
                      description: version is the API version of the object.
                      type: string
                  required:
                  - kind
                  - name
                  - version
                  type: object
                type: array
              lastSyncTime:
                description: lastSyncTime is when the last successful sync completed.
                format: date-time
                type: string
              lastSyncedCommit:
                description: lastSyncedCommit is the short commit SHA that was last
                  applied.
                type: string
              message:
                description: message explains the phase when something went wrong.
                type: string
              phase:
                description: phase is a one-word summary of the last sync attempt.
                enum:
                - Pending
                - Synced
                - Drifted
                - Error
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
