---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gitops.miniargo.dev
  resources:
  - gitsources
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gitops.miniargo.dev
  resources:
  - gitsources/finalizers
  verbs:
  - update
- apiGroups:
  - gitops.miniargo.dev
  resources:
  - gitsources/status
  verbs:
  - get
  - patch
  - update
