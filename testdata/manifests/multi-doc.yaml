# Two objects in one file, separated by ---. Both must be applied.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: demo
data:
  message: "served from git"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
